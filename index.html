<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f3f3f1" />
  <title>Private Chat</title>
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("chat-theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = savedTheme === "dark" || savedTheme === "light"
          ? savedTheme
          : systemTheme;
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="page-shell">
    <section id="loginView" class="card login-card" aria-labelledby="loginTitle">
      <div class="login-topbar">
        <span class="brand-dot" aria-hidden="true"></span>
        <button class="theme-toggle" type="button" aria-label="Switch color theme">
          <span class="theme-icon" aria-hidden="true"></span>
          <span class="theme-label">Dark</span>
        </button>
      </div>

      <div class="brand-block">
        <h1 id="loginTitle">Private Chat</h1>
        <p>Sign in to continue.</p>
      </div>

      <form id="loginForm" class="login-form" autocomplete="on">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <button id="loginButton" class="primary-button" type="submit">Sign in</button>
        <p id="loginError" class="form-message error-message" role="alert" aria-live="polite"></p>
      </form>
    </section>

    <section id="chatView" class="chat-card hidden" aria-label="Private chat">
      <header class="chat-header">
        <div>
          <p class="eyebrow">PRIVATE CHAT</p>
          <h1 id="chatTitle">Conversation</h1>
        </div>
        <div class="header-actions">
          <span id="currentUserLabel" class="user-label"></span>
          <button class="theme-toggle compact" type="button" aria-label="Switch color theme">
            <span class="theme-icon" aria-hidden="true"></span>
            <span class="theme-label">Dark</span>
          </button>
          <button id="logoutButton" class="text-button" type="button">Log out</button>
        </div>
      </header>

      <div id="connectionBanner" class="connection-banner hidden" role="status" aria-live="polite"></div>

      <div id="messagesScroller" class="messages-scroller" aria-live="polite" aria-label="Messages">
        <div id="loadOlderWrap" class="load-older-wrap hidden">
          <button id="loadOlderButton" class="secondary-button" type="button">Load older messages</button>
        </div>
        <div id="messages" class="messages"></div>
        <div id="emptyState" class="empty-state hidden">No messages yet.</div>
      </div>

      <form id="messageForm" class="message-form">
        <div id="replyComposer" class="reply-composer hidden" aria-live="polite">
          <div class="reply-composer-copy">
            <strong id="replyAuthor">Replying to</strong>
            <span id="replyPreviewText"></span>
          </div>
          <button id="cancelReplyButton" class="cancel-reply-button" type="button" aria-label="Cancel reply">×</button>
        </div>

        <label class="sr-only" for="messageInput">Message</label>
        <textarea
          id="messageInput"
          name="message"
          rows="1"
          maxlength="2000"
          placeholder="Write a message..."
          autocomplete="off"
          required
        ></textarea>
        <button id="sendButton" class="send-button" type="submit" aria-label="Send message">Send</button>
      </form>
    </section>
  </main>

  <noscript>This site needs JavaScript for the live chat.</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
